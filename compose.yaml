services:
  api:
    build: .
    restart: unless-stopped
    environment:
      FRISS_API_KEY: ${FRISS_API_KEY:?Set FRISS_API_KEY in .env}
      FRISS_DATA_DIR: /data
    ports:
      - "${FRISS_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
